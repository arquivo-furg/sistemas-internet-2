<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erro {{ codigo }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-black min-h-svh flex">
    <div class="m-auto flex flex-col gap-y-2 items-center text-white">
      <img
        class="w-96"
        src="https://http.cat/{{ codigo }}.jpg"
        alt="{{ codigo }}"
      />
      <h1 class="text-4xl font-bold">Erro ao acessar</h1>
      <p class="text-xl">
        Ocorreu um erro ao acessar <span class="font-bold">{{ dominio }}</span>.
      </p>
      <a href="/" class="underline text-blue-600 hover:text-blue-700">
        Voltar para o início
      </a>
    </div>
  </body>
</html>
