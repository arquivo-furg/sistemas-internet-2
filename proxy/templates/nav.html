<nav
  style="
    font-family: sans-serif;
    z-index: 999;
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 25rem;
  "
>
  <div
    style="
      width: 100%;
      height: 2.25rem;
      background-color: #000;
      padding: 0.25rem;
      border-bottom-left-radius: 0.5rem;
      border-bottom-right-radius: 0.5rem;
      border: 2px solid #262626;
      border-top: none;
      box-sizing: border-box;
    "
  >
    <form
      action="/"
      name="dominio"
      style="
        display: flex;
        column-gap: 0.5rem;
        font-size: 0.875rem;
        color: #fff;
      "
    >
      <input
        name="acessar"
        type="text"
        value="{{ url }}"
        style="
          background-color: #262626;
          font-family: monospace;
          padding: 0 0.5rem;
          height: 1.6rem;
          border-radius: 0.25rem;
          border: none;
          color: inherit;
          font-size: inherit;
          flex: 1;
          outline: none;
          box-sizing: border-box;
        "
      />

      <button
        type="submit"
        style="
          background-color: #2563eb;
          color: inherit;
          font-size: inherit;
          font-weight: 600;
          padding: 0 1rem;
          height: 1.6rem;
          border-radius: 0.25rem;
          border: none;
          cursor: pointer;
          transition: background-color 0.15s ease-in-out;
        "
      >
        Acessar
      </button>

      <a
        href="/"
        style="
          display: flex;
          align-items: center;
          background-color: #262626;
          color: inherit;
          font-size: inherit;
          font-weight: 600;
          padding: 0 1rem;
          height: 1.6rem;
          border-radius: 0.25rem;
          text-decoration: none;
        "
      >
        Início
      </a>
    </form>
  </div>
</nav>
