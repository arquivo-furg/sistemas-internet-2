<nav
  style="
    z-index: 999;
    position: absolute;
    top: -2.5rem;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 42rem;
    transition: all 0.15s ease-in-out;
  "
  onmouseover="this.style.top = '0'"
  onmouseout="this.style.top = '-2.5rem'"
  onfocusin="this.style.top='0'"
  onfocusout="this.style.top='-2.5rem'"
>
  <div
    style="
      width: 100%;
      background-color: #000;
      padding: 0.25rem;
      border-bottom-left-radius: 0.5rem;
      border-bottom-right-radius: 0.5rem;
      border: 2px solid #262626;
      box-sizing: border-box;
    "
  >
    <form
      action="/"
      name="dominio"
      style="
        display: flex;
        column-gap: 0.5rem;
        font-size: 0.875rem;
        color: #fff;
      "
    >
      <input
        name="acessar"
        type="text"
        value="{{ dominio }}"
        style="
          background-color: #262626;
          font-family: ui-monospace, monospace;
          padding: 0.125rem 0.5rem;
          border-radius: 0.25rem;
          border: none;
          color: inherit;
          flex: 1;
          outline: none;
          box-sizing: border-box;
        "
      />

      <button
        type="submit"
        style="
          background-color: #2563eb;
          color: #fff;
          font-weight: 600;
          padding: 0.125rem 1rem;
          border-radius: 0.25rem;
          border: none;
          cursor: pointer;
          transition: background-color 0.15s ease-in-out;
        "
        onmouseover="this.style.backgroundColor = '#1d4ed8'"
        onmouseout="this.style.backgroundColor = '#2563eb'"
      >
        Acessar
      </button>

      <a
        href="/"
        style="
          display: block;
          background-color: #262626;
          color: #fff;
          font-weight: 600;
          padding: 0.125rem 1rem;
          border-radius: 0.25rem;
          text-decoration: none;
        "
      >
        Início
      </a>
    </form>
  </div>
  <div
    style="
      z-index: 9999;
      position: absolute;
      top: 2.25rem;
      margin-top: -0.125rem;
      left: 50%;
      transform: translateX(-50%);
      width: 4rem;
      height: 1.5rem;
      background-color: #000;
      border: 2px solid #262626;
      border-top-color: #000;
      border-bottom-left-radius: 1rem;
      border-bottom-right-radius: 1rem;
      box-sizing: border-box;
    "
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="24"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      style="color: #fff; margin-left: auto; margin-right: auto; display: block"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </div>
</nav>
